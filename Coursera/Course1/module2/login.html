<!DOCTYPE html>
<html>
  <head>
   <title>New tab</title>
  </head>
  <body>
  <form action="/registration" method="POST">
    <label for="username">Username:</label><br>
    <input type="text" name="username"><br>
    <label for="password">Password:</label><br>
    <input type="password"/><br>
    <input type="submit"/><br>
    <input type="checkbox" name="dog" value="Dog"/>
    <label for="dog">I own a dog</label><br>
    <input type="checkbox" name="cat" value="Cat"/>
    <label for="cat">I own a cat</label><br>
    <!--Radio buttons are check boxes but only one button can be selected at a time-->
    <input type="radio" name="left" value="Right"/>
    <label for="right"> Iam right-handed</label><br>
    <input type="radio" name="left" value="Left"/>
    <label for="left">
      Iam left-handed
    </label><br>
    <input type="number" name="age"/><br>
    <input type="email" name="email"/><br>
    <input type="file" name="file"/><br>
    <textarea name="multiname" rows="5"></textarea><br>
   <select name="food">
    <option value="choose Icecream">Choose Icecream</option>
    <option value="chocolate">chocolate</option>
    <option value="vanilla">Vanilla</option>
    <option value="strawberry">Strawberry</option>
   </select>
  </form>
  </body>
</html>
